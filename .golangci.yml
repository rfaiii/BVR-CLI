version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  disable:
    - errcheck
    - ineffassign
    - unused
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - path: internal/shell/run.go
        text: "SA1019.*interp.ExecHandler"
        linters:
          - staticcheck
      # These errors open with the product name, which is a proper noun and is
      # spelled that way everywhere else in the UI. Lowercasing it to satisfy
      # ST1005 would make the message read worse than the inconsistency does.
      - source: 'fmt\.Errorf\("Ollama '
        linters:
          - staticcheck
        text: ST1005
      # MCP logging is deprecated as of protocol 2026-07-28 (SEP-2577) but stays
      # functional for at least twelve months. Dropping the handler now would
      # remove working log forwarding before the SDK forces the issue; tracked
      # in docs/TASKLIST.md for the deprecation window.
      - path: internal/agent/tools/mcp/init.go
        text: "SA1019.*LoggingMessageHandler"
        linters:
          - staticcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
