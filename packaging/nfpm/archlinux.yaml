# nfpm config for Arch Linux / Omarchy packages. Rendered by
# scripts/package/build-installers.sh, which sets the environment variables.
#
# arch is the Arch-native spelling (x86_64/aarch64), not Go's amd64/arm64: this
# is the string pacman matches against `uname -m` and it is what the old
# dist/nfpm configs got wrong.
name: "bvr-cli"
arch: "${BVR_ARCH_ARCH}"
platform: "linux"
version: "${BVR_VERSION}"
section: "extra"
priority: "optional"
maintainer: "BVR <bvrcli@users.noreply.github.com>"
description: "BVR is a keyboard-first terminal AI workspace for projects, local models, tools, and automation."
vendor: "BVR"
homepage: "https://bvr-cli.com"
license: "FSL-1.1-MIT"

contents:
  # nfpm does not expand ${VAR} inside contents.src (it globs the
  # literal string and fails), so the build script always stages the
  # cross-compiled binary at this one path before invoking nfpm.
  - src: dist/pkg-staging/bvr-cli
    dst: /usr/bin/bvr-cli
    file_info:
      mode: 0755
  - src: packaging/nfpm/completions/bvr-cli.bash
    dst: /usr/share/bash-completion/completions/bvr-cli
  - src: packaging/nfpm/completions/_bvr-cli
    dst: /usr/share/zsh/site-functions/_bvr-cli
  - src: packaging/nfpm/completions/bvr-cli.fish
    dst: /usr/share/fish/vendor_completions.d/bvr-cli.fish
  - src: packaging/nfpm/manpages/bvr-cli.1.gz
    dst: /usr/share/man/man1/bvr-cli.1.gz
  - src: README.md
    dst: /usr/share/doc/bvr-cli/README.md
  - src: LICENSE.md
    dst: /usr/share/licenses/bvr-cli/LICENSE.md
